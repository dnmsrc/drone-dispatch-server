server:
  port: 8080

spring:
  application:
    name: drone-dispatch-server

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/drone_dispatch?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: app
    password: ${DB_PASSWORD:SkyShow@2026}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

logging:
  level:
    root: info

# ────────────────────────────────────────────────────────────
# 跨域 CORS 白名单（由 CorsProperties 绑定、CorsWebConfig 消费）
# 只放行可信前端来源；允许方法 / 请求头 / 暴露头在 CorsProperties 有默认值，
# 需要覆盖时再在这里按同名 kebab-case 键追加即可。
# 生产环境请改为真实域名（可放 application-prod.yml 或用环境变量覆盖），
# 例如：APP_CORS_ALLOWED-ORIGINS 不适合多值，推荐用 application-prod.yml 维护清单。
# ────────────────────────────────────────────────────────────
app:
  cors:
    allowed-origins:
      # 管理后台 web（Vite dev 端口 8091）。开发期虽走 /api 代理同源，仍放通以便直连调试
      - "http://localhost:8091"
      - "http://127.0.0.1:8091"
      # 用户端 H5（uni-app/Vite 常用 dev 端口 5173，工程尚未建，先预留）
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
    # 允许携带凭证（Cookie / Authorization），登录态必需
    allow-credentials: true
    # 预检缓存 1 小时，减少 OPTIONS 请求次数
    max-age: 3600

  # ── JWT 登录令牌配置（JwtProperties 绑定）──
  jwt:
    # HS256 签名密钥，至少 32 字节。开发默认值仅本地用；
    # 生产必须用环境变量 APP_JWT_SECRET 覆盖，真实密钥禁止提交进 Git
    secret: ${APP_JWT_SECRET:dev-only-skyshow-drone-dispatch-jwt-secret-key-0123456789}
    # token 有效期（分钟），默认 12 小时
    expire-minutes: 720
    # 前端携带 token 的请求头名
    header: Authorization
    # token 前缀（注意尾部空格），最终头形如：Authorization: Bearer xxx.yyy.zzz
    token-prefix: "Bearer "

  # ── 初始管理员（SecurityProperties 绑定，仅 admin_users 为空时初始化一次）──
  security:
    init-admin-enabled: true
    init-admin-username: admin
    init-admin-password: admin123